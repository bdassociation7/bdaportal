# Supabase configuration for BDA Portal

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true

# =============================================================================
# Authentication Configuration
# =============================================================================

[auth]
enabled = true
site_url = "https://portal.bda-global.org"

# Email authentication settings
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Custom SMTP for Resend
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "noreply@bda-global.org"
sender_name = "BDA Portal"

# Custom email templates
[auth.email.template.confirmation]
subject = "Verify Your Email - BDA Portal"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset Your Password - BDA Portal"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "You've Been Invited to BDA Portal"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Sign In to BDA Portal"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm Email Change - BDA Portal"
content_path = "./supabase/templates/email_change.html"

# =============================================================================
# Edge Functions Configuration
# =============================================================================

[functions.woocommerce-webhook]
verify_jwt = false
